services:
  api:
    build: .
    container_name: gotap-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18090:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
