services:
  api:
    build: .
    container_name: gotap-api
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    env_file:
      - .env
    ports:
      - "127.0.0.1:18090:8000"
    volumes:
      - ./data:/data
    environment:
      DOCUMENT_CONVERSION_MAX_FILE_BYTES: ${DOCUMENT_CONVERSION_MAX_FILE_BYTES:-52428800}
      DOCUMENT_CONVERSION_RETENTION_DAYS: ${DOCUMENT_CONVERSION_RETENTION_DAYS:-7}
      DOCUMENT_CONVERSION_TIMEOUT_SECONDS: ${DOCUMENT_CONVERSION_TIMEOUT_SECONDS:-120}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
