[package]
name = "gotap"
version = "0.1.5"
description = "GoTap desktop auto clicker"
license = "MIT"
repository = "https://github.com/zzktz/gotap"
edition = "2021"

[lib]
name = "gotap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GoTap"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
enigo = "0.2"
dirs = "5.0"
log = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
